name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build with Gradle
        run: ./gradlew test bootJar

      - name: Validate Flyway migrations against MySQL
        env:
          ENABLE_MYSQL_FLYWAY_TESTS: 'true'
        run: ./gradlew test --tests "*FlywayMysqlMigrationIntegrationTest" --rerun-tasks

      - name: Validate deployment secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_PUBLIC_BASE_URL: ${{ secrets.AWS_S3_PUBLIC_BASE_URL }}
          CACHE_TYPE: ${{ secrets.CACHE_TYPE }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_PEM_KEY: ${{ secrets.AWS_EC2_PEM_KEY }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "DB_URL GitHub Actions secret is required for prod deployment."
            exit 1
          fi
          if [ -z "$DB_USERNAME" ]; then
            echo "DB_USERNAME GitHub Actions secret is required for prod deployment."
            exit 1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD GitHub Actions secret is required for prod deployment."
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "JWT_SECRET GitHub Actions secret is required for prod deployment."
            exit 1
          fi
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "JWT_SECRET must be at least 32 characters."
            exit 1
          fi
          if [ -z "$AWS_S3_BUCKET" ]; then
            echo "AWS_S3_BUCKET GitHub Actions secret is required for prod image uploads."
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION GitHub Actions secret is required for prod image uploads."
            exit 1
          fi
          if [ -z "$AWS_S3_PUBLIC_BASE_URL" ]; then
            echo "AWS_S3_PUBLIC_BASE_URL GitHub Actions secret is required for prod image URLs."
            exit 1
          fi
          if [ -z "$CACHE_TYPE" ]; then
            echo "CACHE_TYPE GitHub Actions secret is required for prod cache."
            exit 1
          fi
          if [ -z "$REDIS_HOST" ]; then
            echo "REDIS_HOST GitHub Actions secret is required for prod cache."
            exit 1
          fi
          if [ -z "$REDIS_PORT" ]; then
            echo "REDIS_PORT GitHub Actions secret is required for prod cache."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME GitHub Actions secret is required for image publishing."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN GitHub Actions secret is required for image publishing."
            exit 1
          fi
          if [ -z "$AWS_EC2_HOST" ]; then
            echo "AWS_EC2_HOST GitHub Actions secret is required for EC2 deployment."
            exit 1
          fi
          if [ -z "$AWS_EC2_PEM_KEY" ]; then
            echo "AWS_EC2_PEM_KEY GitHub Actions secret is required for EC2 deployment."
            exit 1
          fi
      - name: Docker build & push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -t "$DOCKERHUB_USERNAME/meanhwa-back" .
          docker push "$DOCKERHUB_USERNAME/meanhwa-back"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_VALIDITY_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_VALIDITY_MINUTES }}
          JWT_REFRESH_TOKEN_VALIDITY_DAYS: ${{ secrets.JWT_REFRESH_TOKEN_VALIDITY_DAYS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_PUBLIC_BASE_URL: ${{ secrets.AWS_S3_PUBLIC_BASE_URL }}
          CACHE_TYPE: ${{ secrets.CACHE_TYPE }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_TIMEOUT_MILLIS: ${{ secrets.OPENAI_TIMEOUT_MILLIS }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ secrets.OPENAI_MAX_OUTPUT_TOKENS }}
          FLYWAY_ENABLED: ${{ secrets.FLYWAY_ENABLED }}
          FLYWAY_BASELINE_ON_MIGRATE: ${{ secrets.FLYWAY_BASELINE_ON_MIGRATE }}
          JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_PEM_KEY }}
          envs: DOCKERHUB_USERNAME,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,JWT_ACCESS_TOKEN_VALIDITY_MINUTES,JWT_REFRESH_TOKEN_VALIDITY_DAYS,CORS_ALLOWED_ORIGINS,AWS_S3_BUCKET,AWS_REGION,AWS_S3_PUBLIC_BASE_URL,CACHE_TYPE,REDIS_HOST,REDIS_PORT,OPENAI_API_KEY,OPENAI_MODEL,OPENAI_TIMEOUT_MILLIS,OPENAI_MAX_OUTPUT_TOKENS,FLYWAY_ENABLED,FLYWAY_BASELINE_ON_MIGRATE,JPA_DDL_AUTO
          script: |
            set -e
            test -n "$DB_URL"
            test -n "$DB_USERNAME"
            test -n "$DB_PASSWORD"
            test -n "$JWT_SECRET"
            test -n "$AWS_S3_BUCKET"
            test -n "$AWS_REGION"
            test -n "$AWS_S3_PUBLIC_BASE_URL"
            test -n "$CACHE_TYPE"
            test -n "$REDIS_HOST"
            test -n "$REDIS_PORT"

            sudo docker network create meanhwa-net || true
            if ! sudo docker inspect meanhwa-redis > /dev/null 2>&1; then
              sudo docker run -d --restart unless-stopped --name meanhwa-redis --network meanhwa-net \
                --log-driver json-file \
                --log-opt max-size=50m \
                --log-opt max-file=5 \
                redis:alpine
            elif [ "$(sudo docker inspect -f '{{.State.Running}}' meanhwa-redis)" != "true" ]; then
              sudo docker start meanhwa-redis
            fi
            sudo docker network connect meanhwa-net meanhwa-redis || true

            sudo docker pull "$DOCKERHUB_USERNAME/meanhwa-back"
            sudo docker stop meanhwa-server || true
            sudo docker rm meanhwa-server || true

            sudo docker run -d --restart unless-stopped --name meanhwa-server --network meanhwa-net -p 127.0.0.1:8080:8080 \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=5 \
              -e SPRING_PROFILES_ACTIVE="prod" \
              -e CACHE_TYPE="$CACHE_TYPE" \
              -e REDIS_HOST="$REDIS_HOST" \
              -e REDIS_PORT="$REDIS_PORT" \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e FLYWAY_ENABLED="${FLYWAY_ENABLED:-true}" \
              -e FLYWAY_BASELINE_ON_MIGRATE="${FLYWAY_BASELINE_ON_MIGRATE:-false}" \
              -e JPA_DDL_AUTO="${JPA_DDL_AUTO:-validate}" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_ACCESS_TOKEN_VALIDITY_MINUTES="${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:-30}" \
              -e JWT_REFRESH_TOKEN_VALIDITY_DAYS="${JWT_REFRESH_TOKEN_VALIDITY_DAYS:-14}" \
              -e CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}" \
              -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_S3_PUBLIC_BASE_URL="$AWS_S3_PUBLIC_BASE_URL" \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e OPENAI_MODEL="${OPENAI_MODEL:-gpt-5.4-mini}" \
              -e OPENAI_TIMEOUT_MILLIS="${OPENAI_TIMEOUT_MILLIS:-5000}" \
              -e OPENAI_MAX_OUTPUT_TOKENS="${OPENAI_MAX_OUTPUT_TOKENS:-500}" \
              "$DOCKERHUB_USERNAME/meanhwa-back"

            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null; then
                echo "Deployment health check passed."
                exit 0
              fi
              echo "Health check attempt $attempt failed; retrying..."
              sleep 5
            done

            sudo docker ps -a
            sudo docker logs --tail=100 meanhwa-redis
            sudo docker logs --tail=200 meanhwa-server
            exit 1
