spring:
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names:
      - flowers
      - tags
    redis:
      time-to-live: ${CACHE_TTL_MILLIS:300000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/meanhwa?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:14}
  storage:
    type: s3
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
  oauth:
    kakao:
      user-info-url: ${KAKAO_USERINFO_URL:https://kapi.kakao.com/v2/user/me}
      timeout-millis: ${KAKAO_TIMEOUT_MILLIS:3000}
    naver:
      user-info-url: ${NAVER_USERINFO_URL:https://openapi.naver.com/v1/nid/me}
      timeout-millis: ${NAVER_TIMEOUT_MILLIS:3000}
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    timeout-millis: ${OPENAI_TIMEOUT_MILLIS:5000}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:300}
