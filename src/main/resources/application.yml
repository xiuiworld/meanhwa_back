spring:
  application:
    name: meanhwa_back
  profiles:
    default: local
  cache:
    type: simple
    cache-names:
      - flowers
      - tags
  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  jwt:
    secret: default-dev-jwt-secret-for-meanhwa-local-and-test-only
    access-token-validity-minutes: 30
    refresh-token-validity-days: 14
  storage:
    type: fake
    max-file-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  oauth:
    kakao:
      user-info-url: https://kapi.kakao.com/v2/user/me
      timeout-millis: 3000
    naver:
      user-info-url: https://openapi.naver.com/v1/nid/me
      timeout-millis: 3000
  openai:
    base-url: https://api.openai.com
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    timeout-millis: ${OPENAI_TIMEOUT_MILLIS:5000}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:300}
  message:
    rate-limit:
      enabled: true
      max-requests: 10
      window: 1h
      store: memory
